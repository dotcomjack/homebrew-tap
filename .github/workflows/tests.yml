name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

# Added on top of Homebrew's stock tap template, which ships without either of the two
# cost guards below. If this file is ever re-synced from upstream, re-apply them.
#
# Supersede in-flight runs on the same ref instead of paying for all of them. The matrix
# starts two macOS legs per run and a macOS minute bills at 10x a Linux minute, which is
# why this tap cost $1.85 across only 12 runs from Aug 1 to 14 2026, more per run than
# any repo in the account except boardsnap. The last push in a burst is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    # GitHub's default is 360 minutes. Two macOS legs wedged for that long is $57.60,
    # over 30x this tap's measured half-month spend. Tap syntax and formula tests run in
    # about 1.5 minutes, so 30 is deep headroom and past it means a hang.
    timeout-minutes: 30
    strategy:
      matrix:
        # macOS only: every formula and cask in this tap depends on macOS, so a Linux leg
        # can only fail or test nothing.
        os: [ macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
